<!DOCTYPE html>
<html>
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
  </head>
  <title>SI-Prefix LNGI</title>
  <style>
    body {
      background: #300000;
      font-family: Audiowide, sans-serif;
      color: #ff0000;
      text-align: center;
      font-size: 20px;
    }
    h2 {
      font-size: 60px;
    }
    @fontface {
      font-family: "Numbers";
      src: url("FuturaPTBold.otf");
    }
    .current {
      font-family: "Numbers", monospace;
      font-size: 40px;
    }
  </style>
  <body>
    <h2>SI-Prefix LNGI</h2>
    <div class="current" id="current">Loading...</div>
    <script>
      var current = 0;
      setInterval(_=>{
        document.getElementById("current").innerHTML = current;
      }, 100)
    </script>
  </body>
</html>
