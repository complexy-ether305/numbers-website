<!DOCTYPE html>
<html>
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
  </head>
  <title>SI-Prefix LNGI</title>
  <style>
    body {
      background: #300000;
      font-family: Audiowide, sans-serif;
      color: #ff0000;
      text-align: center;
      font-size: 20px;
    }
    h2 {
      font-size: 60px;
    }
    @font-face {
      font-family: Numbers;
      src: url(FuturaPTBold.otf);
    }
    .current {
      font-family: Numbers, monospace;
      font-size: 100px;
    }
  </style>
  <body>
    <h2>SI-Prefix LNGI</h2>
    <div class="current" id="current">Loading...</div>
    <script>
      function Level(x) {
        return `0 0 ${x/5}px`+(x<25?"":`, ${Level(x-25)}`);
      }
      function calculateSIPrefix(x) {
        if (x<3) {
          return (10**x).toFixed(2);
        } else {
          let i = Math.floor(x/3);
          return (10**(x%3)).toFixed(4-(x%3|0))+`<span style="color:hsl(${(i-1)*36},${(i-1)*10}%,50%); text-shadow: ${Level(i-1)}">${" kMGTPEZYRQXWVUDCBAΩΨΞΣ?!@#$%^&*()-':;,.+=/_<>[]`~\|{}¿¡°¤"[i]}</span>`;
        }
      }
      setInterval(_=>{
        let current = Date.now()/1000-1786555000;
        document.getElementById("current").innerHTML = calculateSIPrefix(Math.log10(current/100+1)*(current/86400+1));
      }, 100)
    </script>
  </body>
</html>
