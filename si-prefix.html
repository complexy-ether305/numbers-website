<!DOCTYPE html>
<html>
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
  </head>
  <title>SI-Prefix LNGI</title>
  <style>
    body {
      background: #300000;
      font-family: Audiowide, sans-serif;
      color: #ff0000;
      text-align: center;
      font-size: 20px;
    }
    h2 {
      font-size: 60px;
    }
    @font-face {
      font-family: Numbers;
      src: url(FuturaPTBold.otf);
    }
    .current {
      font-family: Numbers, monospace;
      font-size: 75px;
      color: white;
    }
    button {
      background: #300000;
      color: #ff0000;
      font-family: Audiowide, sans-serif;
    }
  </style>
  <body>
    <h2>SI-Prefix LNGI</h2>
    <div id="time">Loading...</div>
    <button onclick="set1=1-set1">Enable/Disable Space</button><br>
    <div class="current" id="current"></div>
    <div id="current2"></div>
    <script>
      let set1 = 0;
      function Level(x) {
        return `0 0 ${x/5}px`+(x<25?"":`, ${Level(x-25)}`);
      }
      function Abbreviations(x) {
        return ["","k","M","G","T","P","E","Z","Y","R","Q"][x];
      }
      function calculateSIPrefix(x) {
        if (x<3) {
          return (10**x).toFixed(2);
        } else {
          let i = Math.floor(x/3);
          return (10**(x%3)).toFixed(3-(x%3|0))+`<span style="color:hsl(${(i-1)*36},${(i-1)*10}%,50%); text-shadow: ${Level(i-1)}">${(set1==0?"":" ")+Abbreviations(i)}</span>`;
        }
      }
      function SIPrefixNames(x) {
        let names = ["N/A","kilo","mega","giga","tera","peta","exa","zetta","yotta","ronna","quetta"];
        return names[x|0];
      }
      function formatTime(x) {
        let x2 = x%86400;
        return "Day "+(x/86400+1|0)+" | "+[x2/36000%10|0,x2/3600%10|0,":",x2/600%6|0,x2/60%10|0,":",x2/10%6|0,x2%10|0].join('')
      }
      setInterval(_=>{
        let current = Date.now()/1000-1786556300;
        let P1k = Math.floor((Math.log10(current/100+1)*(current/(86400*3)+1))/3);
        document.getElementById("current").innerHTML = calculateSIPrefix(Math.log10(current/100+1)*(current/(86400*3)+1));
        document.getElementById("current2").innerHTML = (Math.floor(10**(Math.log10(current/100+1)*(current/(86400*3)+1)))).toLocaleString()+"<br><br>"+SIPrefixNames(P1k)+` (${Abbreviations(P1k)})`;
        document.getElementById("time").innerHTML = formatTime(current);
      }, 1)
    </script>
  </body>
</html>
