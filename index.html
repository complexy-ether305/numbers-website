<!DOCTYPE html>
<html>

    <link rel="preconnect" href="https://fonts.googleapis.com">

  <title>Complexy Website</title>

    body {

      color: #ff0000;

      font-size: 60px;

  <body>
    <h2>Complexy Website</h2>

      setInterval(_=>{

        document.getElementById("current").innerHTML = current;
      }, 100)
